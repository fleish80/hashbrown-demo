<div class="shell" [class.shell-inspector-open]="inspector.open()">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">🥔</span>
      <span class="brand-name">Hashbrown Examples</span>
    </a>
    <nav class="nav" aria-label="Examples">
      @for (example of examples; track example.slug) {
        <a
          class="nav-link"
          [routerLink]="['/', example.slug]"
          routerLinkActive="nav-link-active"
        >
          <span class="nav-title">{{ example.title }}</span>
          <span class="nav-summary">{{ example.summary }}</span>
        </a>
      }
    </nav>
    <button
      class="inspector-toggle"
      type="button"
      [class.inspector-toggle-active]="inspector.open()"
      [attr.aria-pressed]="inspector.open()"
      (click)="inspector.toggle()"
    >
      <span class="inspector-toggle-label">AG-UI events</span>
      <span class="inspector-toggle-count">{{ inspector.eventCount() }}</span>
    </button>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
  @if (inspector.open()) {
    <app-ag-ui-inspector-panel class="inspector" />
  }
</div>
